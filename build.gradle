plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
}

import groovy.json.JsonSlurper
import java.nio.file.Files
import static java.nio.file.StandardCopyOption.ATOMIC_MOVE
import static java.nio.file.StandardCopyOption.REPLACE_EXISTING

group = 'com.cookie.runecore'
def manifestFile = file("src/main/resources/manifest.json")
if (manifestFile.exists()) {
    def manifest = new JsonSlurper().parse(manifestFile)
    version = manifest.Version
} else {
    version = '1.0.0-SNAPSHOT'
}

ext {
    def localProps = new Properties()
    def localPropsFile = project.rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localProps.load(localPropsFile.newDataInputStream())
    }
    
    def rawDir = localProps.getProperty('hytale.dir')
    if (rawDir) {
        hytaleHome = rawDir.endsWith('/Mods') || rawDir.endsWith('/Mods/') ? rawDir.substring(0, rawDir.lastIndexOf('/Mods')) : rawDir
    } else if (localProps.getProperty('hytale.mods.dest')) {
        def dest = file(localProps.getProperty('hytale.mods.dest'))
        hytaleHome = dest.isDirectory() ? dest.parent : dest.parentFile?.parent
    } else {
        hytaleHome = System.getProperty("os.name").toLowerCase().contains("win") 
            ? "${System.getProperty("user.home")}/AppData/Roaming/Hytale"
            : "${System.getProperty("user.home")}/.var/app/com.hypixel.HytaleLauncher/data/Hytale/UserData"
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.hytale.com/release' }
    maven { url 'https://maven.hytale.com/pre-release' }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named("jar") {
    destinationDirectory.set(file("$projectDir/build/libs"))
}

// Validacao dos arquivos .ui
tasks.register('checkUi', Exec) {
    group = 'verification'
    description = 'Valida caminhos, chaves de traducao e sintaxe dos arquivos .ui'

    def script = file("$projectDir/tools/check_ui.py")
    onlyIf { script.exists() }

    commandLine 'python3', script.absolutePath

    def localProps = new Properties()
    def f = project.rootProject.file('local.properties')
    def assetsDir = System.getenv('HYTALE_ASSETS')
    if (assetsDir == null && f.exists()) {
        localProps.load(f.newDataInputStream())
        assetsDir = localProps.getProperty('hytale.assets.path') ?: localProps.getProperty('hytale.assets')
    }
    if (assetsDir != null) {
        environment 'HYTALE_ASSETS', assetsDir
    }
}

tasks.named('processResources') {
    dependsOn 'checkUi'
}

// Tarefa de deploy atomico
tasks.register('deploy') {
    group = 'hytale'
    description = 'Compila o jar e realiza copia atomica para a pasta Mods do Hytale'
    dependsOn 'jar'

    def jarFile = tasks.jar.archiveFile

    inputs.file(jarFile)
    outputs.upToDateWhen { false }

    doLast {
        def localProps = new Properties()
        def localPropsFile = project.rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            localProps.load(localPropsFile.newDataInputStream())
        }

        def customDest = localProps.getProperty('hytale.mods.dest')
        def targetDir = customDest ? (file(customDest).isDirectory() || !customDest.endsWith(".jar") ? file(customDest) : file(customDest).parentFile) : file("${hytaleHome}/Mods")

        targetDir.mkdirs()

        def source = jarFile.get().asFile
        def target = new File(targetDir, source.name)
        def temp = new File(targetDir, "." + source.name.replace(".jar", "") + ".deploy.tmp")

        try {
            Files.copy(source.toPath(), temp.toPath(), REPLACE_EXISTING)
            Files.move(temp.toPath(), target.toPath(), REPLACE_EXISTING, ATOMIC_MOVE)
            println "Deploy realizado com sucesso em: ${target}"
        } catch (Exception e) {
            temp.delete()
            throw e
        }
    }
}

// Ferramentas de CLI Hytale
def javaToolchains = project.extensions.getByType(JavaToolchainService)
def java25Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}

def getAssetsPath() {
    def localProps = new Properties()
    def f = project.rootProject.file('local.properties')
    if (f.exists()) localProps.load(f.newDataInputStream())
    return localProps.getProperty('hytale.assets.path') ?: ""
}

tasks.register('hytaleVersion', JavaExec) {
    group = 'hytale'
    description = 'Prints the Hytale Server version information'
    javaLauncher = java25Launcher
    classpath = files('libs/HytaleServer.jar')
    mainClass = 'com.hypixel.hytale.Main'
    args = ['--version']
}

tasks.register('generateSchemas', JavaExec) {
    group = 'hytale'
    description = 'Generates Hytale JSON Schemas'
    javaLauncher = java25Launcher
    classpath = files('libs/HytaleServer.jar')
    mainClass = 'com.hypixel.hytale.Main'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
    args = [
        '--generate-asset-schema', 'Schema/Asset',
        '--generate-config-schema', 'Schema/Config',
        '--assets', getAssetsPath()
    ]
    doFirst {
        file('Schema/Asset').mkdirs()
        file('Schema/Config').mkdirs()
    }
}

tasks.register('validateAssets', JavaExec) {
    group = 'hytale'
    description = 'Validates mod assets and configs'
    javaLauncher = java25Launcher
    classpath = files('libs/HytaleServer.jar')
    mainClass = 'com.hypixel.hytale.Main'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
    args = [
        '--bare',
        '--validate-assets',
        '--shutdown-after-validate',
        '--assets', getAssetsPath(),
        '--mods', '.'
    ]
    ignoreExitValue = true
}

tasks.register('validatePrefabs', JavaExec) {
    group = 'hytale'
    description = 'Validates Hytale prefab assets (.prefab)'
    javaLauncher = java25Launcher
    classpath = files('libs/HytaleServer.jar')
    mainClass = 'com.hypixel.hytale.Main'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
    args = [
        '--bare',
        '--validate-prefabs',
        '--shutdown-after-validate',
        '--assets', getAssetsPath()
    ]
}

tasks.register('verifyWorlds', JavaExec) {
    group = 'hytale'
    description = 'Verifies integrity of all worlds'
    javaLauncher = java25Launcher
    classpath = files('libs/HytaleServer.jar')
    mainClass = 'com.hypixel.hytale.Main'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
    args = [
        '--verify-worlds',
        '--assets', getAssetsPath()
    ]
}
