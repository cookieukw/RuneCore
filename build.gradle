plugins {
    id 'java'
}

import groovy.json.JsonSlurper

group = 'com.cookie.runecore'
def manifestFile = file("src/main/resources/manifest.json")
if (manifestFile.exists()) {
    def manifest = new JsonSlurper().parse(manifestFile)
    version = manifest.Version
} else {
    version = '1.0.0-SNAPSHOT'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.hytale.com/release' }
    maven { url 'https://maven.hytale.com/pre-release' }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    // The engine jar is compileOnly, which does not reach the test classpath. Tests that touch
    // types like Ref or EntityStore (even just as null field values) need it here too.
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.jar {
    destinationDirectory = file("/home/cookie/.var/app/com.hypixel.HytaleLauncher/data/Hytale/UserData/Mods/")
}
